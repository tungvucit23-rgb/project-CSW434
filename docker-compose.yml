services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dichung
      POSTGRES_USER: dichung
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dichung_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dichung"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dichung_pg:
