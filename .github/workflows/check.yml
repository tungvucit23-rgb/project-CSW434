name: Check project
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test -w @di-chung/mobile
      - run: node scripts/team-audit.mjs
      - run: node scripts/validate-team-handoff.mjs
      - run: node scripts/validate-source-publication.mjs --tracked
      - run: npm run test:llm
      - run: npm run test:integration
      - run: npm run build:web
        env:
          CI: '1'
